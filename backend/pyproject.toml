[project]
name = "data-analyst-backend"
version = "0.1.0"
description = "Autonomous data analyst agent backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.2.0",
    "langchain-anthropic>=0.2.0",
    "duckdb>=1.1.0",
    "pandas>=2.2.0",
    "numpy>=2.1.0",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.setuptools.package-data]
"app.agent.skills" = ["*.md"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
    "pyyaml>=6.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# The live suite calls a real LLM; opt in with `pytest -m live`.
addopts = "-m 'not live'"
markers = ["live: requires a real LLM API key"]
